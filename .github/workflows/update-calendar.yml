name: Update calendar feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Build calendar feeds
        env:
          UITDATABANK_API_KEY: ${{ secrets.UITDATABANK_API_KEY }}
        run: python -m citycalendar.cli

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/cache data/events.json
          git diff --staged --quiet || git commit -m "chore: refresh calendar feeds"
          git push
