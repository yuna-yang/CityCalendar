[project]
name = "citycalendar"
version = "0.1.0"
description = "Open, subscribable calendar feeds (flea markets, exhibitions, museum free days, events) for Copenhagen and Leuven/Brussels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "icalendar>=5.0",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
